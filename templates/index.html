<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>顔写真暗記アプリ</title>

<!-- CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div id="app">

    <h1>⚽ 顔写真暗記アプリ</h1>

    <!-- =========================
         チーム選択画面
    ========================== -->
    <div id="teamScreen">

        <h2>チームを選択</h2>

        <!-- 自動送りON/OFF -->
        <label>
            <input type="checkbox" id="autoToggle">
            自動送りON（5秒→2秒）
        </label>

        <div id="teamButtons"></div>

    </div>

    <!-- =========================
         問題画面
    ========================== -->
    <div id="quizScreen" style="display:none;">

        <img id="img">

        <h2 id="name"></h2>
        <h3 id="timer"></h3>

        <!-- 手動操作 -->
        <div id="manualControls">

            <button onclick="showAnswer()">答えを見る</button>
            <button onclick="nextImage()">次へ</button>

        </div>

        <!-- 自動操作 -->
        <div id="autoControls">

            <button id="startAutoBtn" onclick="startAuto()">
                自動スタート
            </button>

            <button id="stopAutoBtn" onclick="stopAuto()">
                停止
            </button>

        </div>

        <div>
            <button onclick="backToTeam()">チーム選択へ戻る</button>
        </div>

    </div>

</div>

<!-- JSは外部化 -->
<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
