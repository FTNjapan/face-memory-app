<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>顔写真暗記アプリ</title>

<style>
body {
    background: #1e272e;
    color: white;
    text-align: center;
    font-family: Arial;
}

img {
    width: 220px;
    margin-top: 20px;
}

button {
    font-size: 16px;
    margin: 5px;
    padding: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>⚽ 顔写真暗記アプリ</h1>

<!-- =========================================================
     チーム選択画面
========================================================= -->
<div id="teamScreen">
    <h2>チームを選択</h2>

    <!-- 自動送りON/OFF（ここで事前設定） -->
    <label>
        <input type="checkbox" id="autoToggle">
        自動送りON（5秒→2秒）
    </label>
</div>

<hr>

<!-- =========================================================
     問題画面
========================================================= -->
<div id="quizScreen" style="display:none;">

    <img id="img">
    <h2 id="name"></h2>
    <h3 id="timer"></h3>

    <!-- =====================================================
         手動操作ボタン（自動時は非表示）
    ===================================================== -->
    <div id="manualControls">

        <button onclick="showAnswer()">答えを見る</button>
        <button onclick="next()">次へ</button>

    </div>

    <!-- 自動制御ボタン -->
    <button onclick="startAuto()">自動スタート</button>
    <button onclick="stopAuto()">停止</button>

</div>

<script>

// =========================================================
// 状態管理
// =========================================================
let autoMode = false;
let timer = null;
let currentAnswer = "";

// =========================================================
// チーム一覧取得
// =========================================================
function loadTeams(){

    fetch("/teams")
    .then(res => res.json())
    .then(data => {

        const screen = document.getElementById("teamScreen");

        data.forEach(team => {

            let btn = document.createElement("button");
            btn.innerText = team;

            btn.onclick = () => startTeam(team);

            screen.appendChild(btn);
        });
    });
}

// =========================================================
// チーム選択
// =========================================================
function startTeam(team){

    fetch("/team/" + team)
    .then(() => {

        document.getElementById("teamScreen").style.display = "none";
        document.getElementById("quizScreen").style.display = "block";

        next();
    });
}

// =========================================================
// 次の画像取得
// =========================================================
function next(){

    fetch("/next")
    .then(res => res.json())
    .then(data => {

        if(data.end){
            document.getElementById("name").innerText = "終了";
            return;
        }

        document.getElementById("img").src = data.image;

        // 答えを保存（後で表示用）
        currentAnswer = data.answer;

        document.getElementById("name").innerText = "";
    });
}

// =========================================================
// 答え表示
// =========================================================
function showAnswer(){

    document.getElementById("name").innerText = currentAnswer;
}

// =========================================================
// カウントダウン
// =========================================================
function countdown(sec){

    let t = sec;
    document.getElementById("timer").innerText = t;

    clearInterval(timer);

    timer = setInterval(() => {

        t--;
        document.getElementById("timer").innerText = t;

        if(t <= 0){
            clearInterval(timer);
        }

    }, 1000);
}

// =========================================================
// 自動送り開始
// =========================================================
function startAuto(){

    autoMode = true;

    // 手動ボタン非表示
    document.getElementById("manualControls").style.display = "none";

    function loop(){

        if(!autoMode) return;

        let isAuto = document.getElementById("autoToggle").checked;

        if(!isAuto) return;

        // 5秒：名前なし
        countdown(5);

        setTimeout(() => {

            next();

            // 2秒：名前表示
            showAnswer();

            countdown(2);

            setTimeout(() => {
                loop();
            }, 2000);

        }, 5000);
    }

    loop();
}

// =========================================================
// 停止
// =========================================================
function stopAuto(){

    autoMode = false;

    // 手動ボタン復活
    document.getElementById("manualControls").style.display = "block";
}

// =========================================================
// 初期化
// =========================================================
window.onload = loadTeams;

</script>

</body>
</html>
