<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>顔写真暗記アプリ</title>

<style>
body {
    background: #1e272e;
    color: white;
    text-align: center;
    font-family: Arial;
}

img {
    width: 220px;
    margin-top: 20px;
}

button {
    font-size: 18px;
    margin: 5px;
    padding: 10px;
}
</style>
</head>

<body>

<h1>⚽ 顔写真暗記アプリ</h1>

<div>
    <button onclick="startTeam('team1')">team1</button>
    <button onclick="startTeam('team2')">team2</button>
</div>

<hr>

<img id="img">
<h2 id="name"></h2>
<h3 id="timer"></h3>

<button onclick="startAuto()">自動送りON</button>
<button onclick="stopAuto()">停止</button>
<button onclick="next()">次へ</button>

<script>

let timer = null;
let countdown = null;
let autoMode = false;

// -------------------------
// 次の画像
// -------------------------
function next(){

    fetch("/next")
    .then(res => res.json())
    .then(data => {

        if(data.end){
            document.getElementById("name").innerText = "終了";
            return;
        }

        document.getElementById("img").src = data.image;
        document.getElementById("name").innerText = "";
    });
}

// -------------------------
// カウントダウン
// -------------------------
function startCountdown(sec){

    let t = sec;

    document.getElementById("timer").innerText = t;

    clearInterval(countdown);

    countdown = setInterval(() => {

        t--;
        document.getElementById("timer").innerText = t;

        if(t <= 0){
            clearInterval(countdown);
        }

    }, 1000);
}

// -------------------------
// 自動送り（5秒→2秒）
// -------------------------
function startAuto(){

    autoMode = true;

    function loop(){

        if(!autoMode) return;

        startCountdown(5);

        setTimeout(() => {

            next();

            document.getElementById("name").innerText = "表示中";

            startCountdown(2);

            setTimeout(() => {

                loop();

            }, 2000);

        }, 5000);
    }

    loop();
}

// -------------------------
// 停止
// -------------------------
function stopAuto(){
    autoMode = false;
}

// -------------------------
// チーム選択
// -------------------------
function startTeam(team){

    fetch("/team/" + team)
    .then(() => {
        next();
    });
}

</script>

</body>
</html>
